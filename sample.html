<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンプル冊子 - 電子冊子</title>
<style>
  :root{
    --stage:#20232b;
    --stage-2:#282c36;
    --card:#fbf6ec;
    --gold:#c8973f;
    --gold-dim:#8a6b2f;
    --red:#ab3d2e;
    --ink:#2b2620;
    --text-light:#f2ead9;
    --text-dim:#a9a394;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at 50% 0%, var(--stage-2) 0%, var(--stage) 65%);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text-light);
    overflow:hidden;
  }
  .rice-field{
    position:fixed;inset:0;pointer-events:none;opacity:.3;
    background-image:radial-gradient(circle, rgba(200,151,63,.5) 1px, transparent 1.5px);
    background-size:26px 26px;
  }
  .app{
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:16px 12px 14px;
  }
  header{
    width:100%;max-width:1040px;display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;flex-wrap:wrap;
  }
  .kicker{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:600;}
  h1{
    margin:0;font-size:19px;font-weight:700;color:var(--text-light);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.02em;
  }
  .counter{
    font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);
    border:1px solid rgba(200,151,63,.35);border-radius:999px;padding:5px 14px;
    background:rgba(0,0,0,.2);white-space:nowrap;
  }

  .stage-wrap{
    position:relative;flex:1;width:100%;max-width:1040px;
    display:flex;align-items:center;justify-content:center;min-height:0;
  }
  .book{
    position:relative;height:100%;max-height:80vh;
    aspect-ratio:1240/875;max-width:100%;
    perspective:2600px;
  }
  .book-shadow{
    position:absolute;inset:14px -4px -18px -4px;
    background:rgba(0,0,0,.55);filter:blur(22px);border-radius:8px;z-index:0;
  }
  .sheet{
    position:absolute;top:0;bottom:0;width:50%;background:var(--card);overflow:hidden;
  }
  .sheet.left{left:0;border-radius:4px 0 0 4px;}
  .sheet.right{left:50%;border-radius:0 4px 4px 0;}
  .sheet img{width:100%;height:100%;object-fit:contain;display:block;background:var(--card);user-select:none;-webkit-user-drag:none;}
  .sheet .empty-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#c9bfa0;font-size:12px;letter-spacing:.1em;
  }
  .gutter{
    position:absolute;top:0;bottom:0;left:50%;width:26px;margin-left:-13px;z-index:3;
    pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.16) 50%, rgba(0,0,0,0) 100%);
  }

  .flip-overlay{
    position:absolute;top:0;left:50%;width:50%;height:100%;
    transform-style:preserve-3d;transform-origin:left center;
    z-index:5;display:none;
  }
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;background:var(--card);
  }
  .face.front{border-radius:0 4px 4px 0;}
  .face.back{transform:rotateY(180deg);border-radius:4px 0 0 4px;}
  .face img{width:100%;height:100%;object-fit:contain;display:block;background:var(--card);user-select:none;-webkit-user-drag:none;}
  .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
  .face.front .shade{background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 60%);}
  .face.back .shade{background:linear-gradient(270deg, rgba(0,0,0,.35), rgba(0,0,0,0) 60%);}

  .tap-zone{position:absolute;top:0;bottom:0;width:30%;z-index:2;cursor:pointer;}
  .tap-zone.left{left:0;}
  .tap-zone.right{right:0;}

  .controls{
    width:100%;max-width:1040px;display:flex;align-items:center;gap:14px;
    margin-top:12px;justify-content:center;
  }
  .nav-btn{
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(200,151,63,.5);
    background:linear-gradient(180deg, var(--red), #7e2c21);color:#fbf1e7;font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.4);transition:transform .12s ease;
    flex-shrink:0;
  }
  .nav-btn:active{transform:scale(.92);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  .nav-btn:disabled:active{transform:none;}

  .progress-wrap{flex:1;max-width:440px;display:flex;flex-direction:column;gap:6px;}
  .progress-bar{
    height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
    cursor:pointer;position:relative;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    border-radius:99px;transition:width .25s ease;
  }
  .jump-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
  .jump-row input{
    width:46px;background:rgba(0,0,0,.25);border:1px solid rgba(200,151,63,.35);
    border-radius:6px;color:var(--text-light);text-align:center;font-size:12px;padding:3px 2px;
  }
  .sound-toggle{
    border:1px solid rgba(200,151,63,.4);background:rgba(0,0,0,.25);color:var(--text-dim);
    border-radius:999px;padding:5px 11px;font-size:11px;cursor:pointer;white-space:nowrap;
  }
  .sound-toggle[data-on="true"]{color:var(--gold);border-color:var(--gold);}

  body.fs-mode header{display:none;}
  body.fs-mode .controls{display:none;}
  body.fs-mode .app{padding:0;}
  body.fs-mode .stage-wrap{max-width:100%;padding:0;}
  body.fs-mode .book{max-height:98vh;height:98vh;}

  .fs-exit-hint{
    position:fixed;top:14px;right:14px;z-index:50;opacity:0;pointer-events:none;
    transition:opacity .25s ease;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(200,151,63,.5);background:rgba(0,0,0,.4);color:#fbf1e7;
    font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  body.fs-mode .fs-exit-hint{opacity:.45;pointer-events:auto;}
  .fs-exit-hint:hover{opacity:1;}

  .lock-screen{
    position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 0%, var(--stage-2) 0%, var(--stage) 65%);
  }
  .lock-card{
    width:min(320px,88vw);text-align:center;padding:32px 26px;border-radius:12px;
    background:rgba(0,0,0,.3);border:1px solid rgba(200,151,63,.35);
  }
  .lock-icon{font-size:34px;margin-bottom:6px;}
  .lock-card h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;margin:0 0 6px;
    color:var(--text-light);
  }
  .lock-card p{font-size:12px;color:var(--text-dim);margin:0 0 18px;line-height:1.6;}
  .lock-card input{
    width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(200,151,63,.4);
    border-radius:6px;color:var(--text-light);padding:10px 12px;font-size:14px;
    text-align:center;margin-bottom:12px;
  }
  .lock-card button{
    width:100%;padding:11px;border-radius:8px;border:none;
    background:linear-gradient(180deg, var(--red), #7e2c21);color:#fbf1e7;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .lock-card button:disabled{opacity:.5;cursor:default;}
  .lock-error{font-size:12px;color:#e79a8d;margin-top:10px;min-height:14px;}

  @media (max-width:700px){
    h1{font-size:14px;}
    .kicker{font-size:9px;}
    .counter{font-size:10px;padding:4px 9px;}
    .nav-btn{width:38px;height:38px;font-size:15px;}
    .book{max-height:64vh;}
  }
</style>
</head>
<body>
<div class="rice-field"></div>
<button class="fs-exit-hint" id="fsExitHint" title="フルスクリーン終了 (Escキー)">✕</button>

<div class="lock-screen" id="lockScreen" style="display:none;">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>サンプル冊子</h2>
    <p>この電子冊子はパスワードで保護されています。<br>閲覧するにはパスワードを入力してください。</p>
    <input type="password" id="lockPasswordInput" placeholder="パスワード">
    <button id="lockSubmitBtn">開く</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div class="app" id="appRoot">
  <header>
    <div>
      <span class="kicker">DIGITAL BOOKLET VIEWER</span>
      <h1>サンプル冊子</h1>
    </div>
    <div class="counter" id="counterLabel">表紙</div>
  </header>

  <div class="stage-wrap">
    <div class="book" id="book">
      <div class="book-shadow"></div>
      <div class="sheet left" id="leftSheet"><img id="leftImg" alt=""><div class="empty-hint" id="leftHint"></div></div>
      <div class="sheet right" id="rightSheet"><img id="rightImg" alt=""><div class="empty-hint" id="rightHint"></div></div>
      <div class="gutter"></div>

      <div class="flip-overlay" id="flipOverlay">
        <div class="face front" id="faceFront"><img id="frontImg" alt=""><div class="shade" id="frontShade"></div></div>
        <div class="face back" id="faceBack"><img id="backImg" alt=""><div class="shade" id="backShade"></div></div>
      </div>

      <div class="tap-zone left" id="zoneLeft"></div>
      <div class="tap-zone right" id="zoneRight"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="前へ">&#10094;</button>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="jump-row">
        <span>見開き移動:</span>
        <input type="number" id="jumpInput" min="0" value="0">
        <button class="sound-toggle" id="jumpBtn">移動</button>
        <button class="sound-toggle" id="soundBtn" data-on="true">🔊 音あり</button>
        <button class="sound-toggle" id="fsBtn">⛶ フルスクリーン</button>
      </div>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="次へ">&#10095;</button>
  </div>
</div>

<audio id="flipSound" preload="auto"></audio>

const leftImg = document.getElementById('leftImg');
const rightImg = document.getElementById('rightImg');
const leftSheet = document.getElementById('leftSheet');
const rightSheet = document.getElementById('rightSheet');
const leftHint = document.getElementById('leftHint');
const rightHint = document.getElementById('rightHint');
const overlay = document.getElementById('flipOverlay');
const frontImg = document.getElementById('frontImg');
const backImg = document.getElementById('backImg');
const frontShade = document.getElementById('frontShade');
const backShade = document.getElementById('backShade');
const counterLabel = document.getElementById('counterLabel');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const jumpInput = document.getElementById('jumpInput');
const flipSound = document.getElementById('flipSound');
const soundBtn = document.getElementById('soundBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

flipSound.src = "data:audio/mpeg;base64," + FLIP_AUDIO_B64;

let N = PAGES.length;
let kMaxVerso = Math.floor(N / 2);
let leafIndex = 0;
let animating = false;
let soundOn = true;

jumpInput.max = kMaxVerso;

function imgSrc(i){ return "data:image/jpeg;base64," + PAGES[i]; }
function rightIdxOf(k){ return (2*k < N) ? 2*k : null; }
function leftIdxOf(k){ return (k >= 1 && 2*k-1 < N) ? 2*k-1 : null; }

function labelFor(k){
  const li = leftIdxOf(k), ri = rightIdxOf(k);
  if(li===null && ri!==null) return LABELS[ri];
  if(li!==null && ri!==null) return LABELS[li] + " - " + LABELS[ri];
  if(li!==null && ri===null) return LABELS[li];
  return "";
}

function setSheet(imgEl, hintEl, sheetEl, idx){
  if(idx===null){
    imgEl.style.visibility = 'hidden';
    hintEl.style.display = 'none';
    sheetEl.style.background = 'var(--card)';
  } else {
    imgEl.src = imgSrc(idx);
    imgEl.style.visibility = 'visible';
    hintEl.style.display = 'none';
  }
}

function updateStatic(k){
  setSheet(leftImg, leftHint, leftSheet, leftIdxOf(k));
  setSheet(rightImg, rightHint, rightSheet, rightIdxOf(k));
  counterLabel.textContent = labelFor(k);
  jumpInput.value = k;
  progressFill.style.width = (kMaxVerso ? (k/kMaxVerso*100) : 0).toFixed(2) + "%";
  prevBtn.disabled = k <= 0;
  nextBtn.disabled = k >= kMaxVerso;
}

function playSound(){
  if(!soundOn) return;
  try{ flipSound.currentTime = 0; flipSound.play().catch(()=>{}); }catch(e){}
}

function easeInOutQuad(p){ return p<0.5 ? 2*p*p : -1+(4-2*p)*p; }

function flip(direction){
  if(animating) return;
  if(direction === 'next' && leafIndex >= kMaxVerso) return;
  if(direction === 'prev' && leafIndex <= 0) return;

  animating = true;
  const k = (direction === 'next') ? leafIndex : leafIndex - 1;
  const frontIndex = rightIdxOf(k);
  const backIndex = leftIdxOf(k+1);

  if(frontIndex !== null) frontImg.src = imgSrc(frontIndex);
  frontImg.style.visibility = frontIndex !== null ? 'visible' : 'hidden';
  if(backIndex !== null) backImg.src = imgSrc(backIndex);
  backImg.style.visibility = backIndex !== null ? 'visible' : 'hidden';

  if(direction === 'next'){
    const newRight = rightIdxOf(k+1);
    setSheet(rightImg, rightHint, rightSheet, newRight);
  } else {
    const newLeft = leftIdxOf(k);
    setSheet(leftImg, leftHint, leftSheet, newLeft);
  }

  overlay.style.display = 'block';
  const startAngle = direction === 'next' ? 0 : -180;
  const endAngle = direction === 'next' ? -180 : 0;
  const duration = 950;
  const t0 = performance.now();
  playSound();

  function step(now){
    const p = Math.min((now - t0) / duration, 1);
    const eased = easeInOutQuad(p);
    const angle = startAngle + (endAngle - startAngle) * eased;
    overlay.style.transform = "rotateY(" + angle + "deg)";
    const rad = Math.abs(angle) * Math.PI / 180;
    const shade = Math.max(0, Math.sin(rad));
    frontShade.style.opacity = (angle > -90 ? shade * 0.55 : 0);
    backShade.style.opacity = (angle <= -90 ? shade * 0.55 : 0);
    if(p < 1){
      requestAnimationFrame(step);
    } else {
      overlay.style.display = 'none';
      overlay.style.transform = 'rotateY(0deg)';
      leafIndex = (direction === 'next') ? leafIndex + 1 : leafIndex - 1;
      updateStatic(leafIndex);
      animating = false;
    }
  }
  requestAnimationFrame(step);
}

prevBtn.addEventListener('click', ()=> flip('prev'));
nextBtn.addEventListener('click', ()=> flip('next'));
document.getElementById('zoneRight').addEventListener('click', ()=> flip('next'));
document.getElementById('zoneLeft').addEventListener('click', ()=> flip('prev'));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') flip('next');
  if(e.key === 'ArrowLeft') flip('prev');
});

progressBar.addEventListener('click', (e)=>{
  if(animating) return;
  const rect = progressBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const target = Math.round(ratio * kMaxVerso);
  jumpTo(target);
});

document.getElementById('jumpBtn').addEventListener('click', ()=>{
  const v = parseInt(jumpInput.value, 10);
  if(!isNaN(v)) jumpTo(v);
});
jumpInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('jumpBtn').click();
});

function jumpTo(target){
  target = Math.min(Math.max(target,0), kMaxVerso);
  if(target === leafIndex || animating) { updateStatic(leafIndex); return; }
  leafIndex = target;
  updateStatic(leafIndex);
}

soundBtn.addEventListener('click', ()=>{
  soundOn = !soundOn;
  soundBtn.dataset.on = soundOn;
  soundBtn.textContent = soundOn ? "🔊 音あり" : "🔇 音なし";
});

const fsBtn = document.getElementById('fsBtn');
function isFullscreenNow(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function updateFsBtn(){
  fsBtn.textContent = isFullscreenNow() ? "⤢ フルスクリーン終了" : "⛶ フルスクリーン";
  document.body.classList.toggle('fs-mode', isFullscreenNow());
}
fsBtn.addEventListener('click', ()=>{
  const el = document.documentElement;
  if(!isFullscreenNow()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
});
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);
document.addEventListener('msfullscreenchange', updateFsBtn);
document.addEventListener('keydown', (e)=>{ if(e.key === 'f' || e.key === 'F') fsBtn.click(); });

const fsExitHint = document.getElementById('fsExitHint');
fsExitHint.addEventListener('click', ()=>{
  if(isFullscreenNow()){
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
});

let touchStartX = null;
document.getElementById('book').addEventListener('touchstart', (e)=>{
  touchStartX = e.changedTouches[0].clientX;
}, {passive:true});
document.getElementById('book').addEventListener('touchend', (e)=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){
    if(dx < 0) flip('next'); else flip('prev');
  }
  touchStartX = null;
}, {passive:true});

function base64ToUint8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function decryptPagesPayload(password, saltB64, ivB64, cipherB64){
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const salt = base64ToUint8(saltB64);
  const iv = base64ToUint8(ivB64);
  const cipherBytes = base64ToUint8(cipherB64);
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipherBytes);
  return JSON.parse(dec.decode(plainBuf));
}

function recomputeBounds(){
  N = PAGES.length;
  kMaxVerso = Math.floor(N / 2);
  jumpInput.max = kMaxVerso;
}

function startBook(){
  recomputeBounds();
  leafIndex = 0;
  updateStatic(0);
}

async function attemptUnlock(){
  const pwd = document.getElementById('lockPasswordInput').value;
  const errEl = document.getElementById('lockError');
  const submitBtn = document.getElementById('lockSubmitBtn');
  errEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = '確認中...';
  try{
    const result = await decryptPagesPayload(pwd, SALT_B64, IV_B64, CIPHER_B64);
    PAGES = result.p;
    LABELS = result.l;
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    startBook();
  }catch(e){
    errEl.textContent = 'パスワードが正しくありません';
    submitBtn.disabled = false;
    submitBtn.textContent = '開く';
  }
}

if(REQUIRE_PASSWORD){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockSubmitBtn').addEventListener('click', attemptUnlock);
  document.getElementById('lockPasswordInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') attemptUnlock();
  });
} else {
  startBook();
}
</script>
